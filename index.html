<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matheheft 3 und 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow notebook column on squared paper (Rechenkästchen); light = Schulheft with royal-blue ink, dark = Schultafel with chalk. */
:root{
  --paper:#fafcff; --grid:#dbe6f7; --card:#ffffff; --soft:#e9f0fd; --line:#bfcdea;
  --text:#18213d; --muted:#56627f; --primary:#2446c4; --on-primary:#ffffff;
  --sun:#ffc93c; --on-sun:#3a2c00; --ok:#12804d; --ok-bg:#dcf5e7; --bad:#c93a2b; --bad-bg:#fde6e2;
  --display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15302a; --grid:#1e3f37; --card:#1c3d35; --soft:#25493f; --line:#3a6155;
  --text:#f0f5ef; --muted:#abc3ba; --primary:#ffd35c; --on-primary:#1b2b10;
  --sun:#ffd35c; --on-sun:#2b2400; --ok:#7be0a8; --ok-bg:#1f4a36; --bad:#ff9a88; --bad-bg:#4a2a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15302a; --grid:#1e3f37; --card:#1c3d35; --soft:#25493f; --line:#3a6155;
  --text:#f0f5ef; --muted:#abc3ba; --primary:#ffd35c; --on-primary:#1b2b10;
  --sun:#ffd35c; --on-sun:#2b2400; --ok:#7be0a8; --ok-bg:#1f4a36; --bad:#ff9a88; --bad-bg:#4a2a26; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font:16px/1.45 var(--body);color:var(--text);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line);margin:0 -16px;padding:8px 16px}
.hd{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.ava{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.who{min-width:0;flex:1}
.who b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpb{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:3px}
.xpb i{display:block;height:100%;background:var(--sun);border-radius:8px;transition:width .5s}
.who small{color:var(--muted);font-size:12px}
.chip{font-family:var(--display);font-weight:700;padding:6px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.gear{width:40px;height:40px;border-radius:50%;font-size:20px}
main{padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
body.insess header,body.insess nav{display:none}
body.insess main{padding-block:12px 12px}
nav{position:fixed;inset:auto 0 0;z-index:5;background:var(--card);border-top:2px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nv{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;gap:4px}
.nv button{padding:6px 2px;border-radius:12px;font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted);display:grid;gap:1px;justify-items:center}
.nv button span{font-size:20px;line-height:1.1}
.nv button.on{color:var(--primary);background:var(--soft)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:14px;
  background:var(--primary);color:var(--on-primary);font-family:var(--display);font-weight:700;font-size:18px;box-shadow:0 4px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.btn.sec{background:var(--soft);color:var(--text);box-shadow:0 4px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--on-sun);box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.sm{min-height:42px;font-size:15px;padding:6px 14px}
.btn.wide{width:100%}
.bubble{display:flex;gap:12px;align-items:flex-start}
.bubble p{margin:0;background:var(--card);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.mission{background:var(--primary);color:var(--on-primary);border-color:transparent;display:grid;gap:10px}
.mission h2{font-size:26px}
.mission p{margin:0;opacity:.9}
.mission .btn{box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.goal{display:grid;gap:6px}
.bar{height:14px;border-radius:14px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:14px;transition:width .4s}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.sp{justify-content:space-between}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:19px}
.tile small,.muted{color:var(--muted);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;height:30px;border-radius:10px;border:2px dashed var(--line);margin-bottom:2px;font-style:normal;line-height:26px;font-size:16px}
.week .on i{background:var(--sun);border:2px solid var(--sun);color:var(--on-sun)}
.week .now{color:var(--text);font-weight:700}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 16px;border-radius:9px;font-family:var(--display);font-weight:700}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.topic{display:grid;gap:8px;align-content:start}
.sym{width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px}
.topic h3{font-size:16px}
.stars{letter-spacing:2px;color:var(--sun);font-size:18px}
.stars s{text-decoration:none;color:var(--line)}
.topic .row{gap:6px}
.rule{background:var(--soft);border-left:6px solid var(--sun);border-radius:8px;padding:12px 14px}
.ex{font-family:var(--display);font-size:18px;line-height:1.7}
/* session */
.sess{display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px)}
.sbar{display:flex;align-items:center;gap:10px}
.sbar .x{width:40px;height:40px;border-radius:50%;background:var(--soft);font-weight:700;flex:none}
.sbar .bar{flex:1}
.combo{font-family:var(--display);font-weight:800;min-width:48px;text-align:right}
.qcard{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:170px}
.qtopic{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(30px,10vw,46px);line-height:1.2}
.qtext.w{font-size:19px;font-weight:600;line-height:1.4;text-align:left}
pre.col{font:700 clamp(26px,8vw,36px)/1.25 var(--mono);margin:0;text-align:left;display:inline-block}
.ans{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-size:32px;font-weight:700}
.inp{min-width:110px;min-height:54px;padding:4px 14px;border:3px solid var(--primary);border-radius:12px;background:var(--paper);display:inline-block;text-align:center}
.inp:empty::after{content:"?";color:var(--line)}
.inp.good{border-color:var(--ok);background:var(--ok-bg)}
.inp.oops{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.unit{font-size:22px;color:var(--muted)}
.fb{border-radius:12px;padding:10px 14px;font-family:var(--display);font-weight:700;text-align:center;background:var(--ok-bg);color:var(--ok);min-height:46px}
.fb.neutral{background:transparent;color:var(--muted);font-weight:500;font-family:var(--body);font-size:14px}
.help{align-self:center;padding:10px 16px;border-radius:999px;border:2px dashed var(--line);color:var(--muted);font-weight:600;background:var(--card)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:54px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-size:24px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.pad button:active{transform:translateY(2px);box-shadow:none}
.pad .okb{background:var(--primary);color:var(--on-primary);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb,var(--primary) 60%,#000)}
.pad .rk{grid-column:1/-1;font-size:18px;min-height:44px}
svg.fig{width:200px;max-width:100%}
svg.fig rect{fill:var(--soft);stroke:var(--primary);stroke-width:3}
svg.fig text{fill:var(--text);font:700 15px var(--display)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.75em;line-height:1.1;margin:0 4px}
.fr b:first-child{border-bottom:3px solid currentColor;padding:0 5px}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,40,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:20px 20px 0 0;border:2px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:100%;overflow:auto;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet.in{animation:up .25s}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:17px;animation:pop .25s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);color:var(--on-sun);font-weight:800;display:grid;place-items:center;font-size:14px}
.steps li>span{min-width:0}
.task{font-family:var(--display);font-weight:700;font-size:20px}
.task pre.col{font-size:22px}
details summary{cursor:pointer;color:var(--primary);font-weight:600}
/* result */
.res{text-align:center;display:grid;gap:14px;justify-items:center}
.big{font-family:var(--display);font-size:54px;font-weight:800;line-height:1}
.egg{font-size:84px;line-height:1;animation:wob 1.2s infinite;padding:8px}
.stk{font-size:84px;line-height:1;animation:pop .4s}
.tier1{filter:drop-shadow(0 0 10px var(--sun))}
.tier2{filter:drop-shadow(0 0 16px var(--sun)) drop-shadow(0 0 4px var(--primary))}
.list{display:grid;gap:8px;width:100%;text-align:left}
.badge{display:flex;gap:12px;align-items:center}
.badge .sym{font-size:24px;flex:none}
.badge.off{opacity:.45}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.album div{aspect-ratio:1;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:30px;position:relative}
.album .no{color:var(--line);font-family:var(--display);font-weight:800;font-size:22px;background:transparent;border:2px dashed var(--line)}
.album small{position:absolute;right:3px;bottom:1px;font-size:11px;color:var(--muted)}
.bq{font-family:var(--display);font-weight:800;font-size:clamp(40px,14vw,64px)}
.time{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td:not(:first-child),th:not(:first-child){text-align:right}
.scroll{overflow-x:auto}
input[type=text],textarea{font:inherit;color:var(--text);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{font:12px var(--mono);min-height:110px}
label{font-weight:600;display:grid;gap:4px}
.days{display:flex;align-items:flex-end;gap:3px;height:60px}
.days i{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--paper);padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;max-width:90%;text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){.qcard{min-height:120px;padding:10px}.pad button{min-height:46px}}
</style>
</head>
<body>
<header><div class="hd" id="hd"></div></header>
<main class="wrap" id="app"></main>
<nav><div class="nv" id="nav"></div></nav>
<div id="modal" hidden></div>
<canvas id="fx"></canvas>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const f=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const eur=c=>(c/100).toFixed(2).replace('.',',')+' €';
const fr=(n,d)=>`<span class="fr"><b>${n}</b><b>${d}</b></span>`;
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const day=()=>dstr(new Date());
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES=['Mia','Ben','Lina','Emil','Noah','Hanna','Paul','Ella'];
const PL=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender'];

/* ---------- step-by-step explanations ---------- */
function split(a,b,sg){
  const p=[Math.floor(b/100)*100,Math.floor(b%100/10)*10,b%10].filter(x=>x),op=sg>0?'+':'−',s=[];
  if(p.length>1)s.push(`Zerlege ${b} in ${p.join(' + ')}.`);
  let r=a;p.forEach(x=>{const n=r+sg*x;s.push(`${r} ${op} ${x} = <b>${n}</b>`);r=n});return s}
function vert(a,op,b){const A=f(a).replace(/ /g,' '),B=f(b).replace(/ /g,' '),w=Math.max(A.length,B.length);
  return `<pre class="col">  ${A.padStart(w)}\n${op} ${B.padStart(w)}\n${'─'.repeat(w+2)}</pre>`}
function colAdd(a,b){const s=['Schreibe die Zahlen genau untereinander: Einer unter Einer, Zehner unter Zehner. Fang rechts an.'];let c=0;
  const len=Math.max(String(a).length,String(b).length);
  for(let i=0;i<len;i++){const x=Math.floor(a/10**i)%10,y=Math.floor(b/10**i)%10,m=x+y+c;
    s.push(`${PL[i]}: ${x} + ${y}${c?' + 1 (gemerkt)':''} = ${m}. Schreibe <b>${m%10}</b>${m>9?' und merke 1':''}.`);c=m>9?1:0}
  if(c)s.push('Die gemerkte 1 kommt ganz nach vorne.');
  s.push(`Ergebnis: <b>${f(a+b)}</b>`);return s}
function colSub(a,b){const s=['Schreibe die Zahlen genau untereinander und fang rechts bei den Einern an.'];let c=0;
  const len=String(a).length;
  for(let i=0;i<len;i++){const x0=Math.floor(a/10**i)%10,y=Math.floor(b/10**i)%10,x=x0-c,was=c;
    if(i===len-1&&x-y===0&&y===0)break;
    if(x<y){s.push(`${PL[i]}: ${x0}${was?' − 1 (verliehen)':''} − ${y} geht nicht. Hol dir 10 von links: ${x+10} − ${y} = <b>${x+10-y}</b>`);c=1}
    else{s.push(`${PL[i]}: ${x0}${was?' − 1 (verliehen)':''} − ${y} = <b>${x-y}</b>`);c=0}}
  s.push(`Ergebnis: <b>${f(a-b)}</b>`);return s}
function malSteps(a,b){
  if(b===10)return['Mal 10 ist leicht: Hänge eine Null an.',`${a} · 10 = <b>${a*10}</b>`];
  if(b>5)return[`Zerlege ${b} in 5 + ${b-5}.`,`${a} · 5 = ${a*5}`,`${a} · ${b-5} = ${a*(b-5)}`,`${a*5} + ${a*(b-5)} = <b>${a*b}</b>`];
  const row=Array.from({length:b},(_,i)=>a*(i+1));
  return[`Zähle ${b}-mal in ${a}er-Schritten.`,row.join(', '),`${a} · ${b} = <b>${a*b}</b>`]}
function divSteps(n,d){const ds=String(n).split('').map(Number);let r=0,s=[],go=false;
  ds.forEach((g,i)=>{const cur=r*10+g,q=Math.floor(cur/d);
    if(!go&&q===0){s.push(`${cur} ist kleiner als ${d}. Nimm die nächste Ziffer dazu.`);r=cur;return}
    go=true;r=cur-q*d;
    s.push(`${cur} : ${d} = <b>${q}</b>${r?`, Rest ${r}`:''}.${i<ds.length-1?` Hol die ${ds[i+1]} herunter: ${r*10+ds[i+1]}`:''}`)});
  s.push(`Ergebnis: <b>${f(n/d)}</b>`);return s}
const rectFig=(a,b)=>`<svg class="fig" viewBox="0 0 230 120" role="img" aria-label="Rechteck ${a} cm mal ${b} cm"><rect x="20" y="12" width="150" height="76" rx="2"/><text x="95" y="110" text-anchor="middle">${a} cm</text><text x="178" y="56">${b} cm</text></svg>`;

/* ---------- word problems: composed from parts (situation x objects x operation x numbers) ---------- */
const GRP=[['Tüte','Tüten','jeder','Sticker'],['Kiste','Kisten','jeder','Äpfel'],['Schachtel','Schachteln','jeder','Stifte'],['Regal','Regale','jedem','Bücher'],['Beutel','Beutel','jedem','Murmeln'],
 ['Packung','Packungen','jeder','Kekse'],['Korb','Körbe','jedem','Eier'],['Reihe','Reihen','jeder','Stühle'],['Karton','Kartons','jedem','Flaschen'],['Bus','Busse','jedem','Plätze'],
 ['Netz','Netze','jedem','Orangen'],['Dose','Dosen','jeder','Bälle'],['Album','Alben','jedem','Fotos'],['Glas','Gläser','jedem','Bonbons']];
const POOL=[['In der Bücherei stehen {x} Bücher.','Bücher','{y} Bücher werden ausgeliehen.','{y} neue Bücher kommen dazu.'],
 ['Im Stadion sitzen {x} Fans.','Fans','{y} Fans gehen nach Hause.','{y} Fans kommen noch dazu.'],
 ['{n} hat {x} Punkte gesammelt.','Punkte','{y} Punkte gibt {n} für einen Preis aus.','{y} Punkte kommen neu dazu.'],
 ['Auf dem Bauernhof leben {x} Hühner.','Hühner','{y} Hühner werden verkauft.','{y} Hühner kommen neu dazu.'],
 ['Im Lager liegen {x} Pakete.','Pakete','{y} Pakete werden abgeholt.','{y} Pakete werden geliefert.'],
 ['Im Zug sitzen {x} Fahrgäste.','Fahrgäste','{y} Fahrgäste steigen aus.','{y} Fahrgäste steigen ein.'],
 ['Die Bäckerei hat {x} Brötchen im Regal.','Brötchen','{y} Brötchen werden verkauft.','{y} Brötchen werden nachgebacken.'],
 ['Im Schwimmbad sind {x} Besucher.','Besucher','{y} Besucher gehen heim.','{y} Besucher kommen dazu.'],
 ['Im Aquarium schwimmen {x} Fische.','Fische','{y} Fische ziehen in ein anderes Becken um.','{y} Fische werden neu eingesetzt.'],
 ['Auf dem Parkplatz stehen {x} Autos.','Autos','{y} Autos fahren weg.','{y} Autos parken neu ein.']];
const SHOP=['Hefte','Bälle','Bücher','Spiele','Tickets','Poster','Eisbecher','T-Shirts','Malkästen','Pflanzen'];
const EXTRA=['einen Füller','eine Tasche','ein Lineal','einen Rucksack','eine Mappe','ein Geschenk'];
const COLL=['Sticker','Punkte','Murmeln','Karten','Muscheln','Kastanien'];
function story(g,L){
  const big=g===4,n=pick(NAMES),m=pick(NAMES.filter(x=>x!==n)),[cs,cp,je,it]=pick(GRP),P=pick(POOL),
   fill=(t,o)=>t.replace(/\{(\w)\}/g,(_,k)=>o[k]),
   mulS=(a,b)=>b<=10?[`${a} · ${b} = <b>${a*b}</b>`]:b%10===0?[`Rechne ohne Null: ${a} · ${b/10} = ${a*b/10}. Hänge die Null an: <b>${f(a*b)}</b>`]
     :[`Zerlege ${b}: ${a} · ${b-b%10} = ${a*(b-b%10)} und ${a} · ${b%10} = ${a*(b%10)}`,`Zusammen: <b>${f(a*b)}</b>`],
   plain=h=>h.replace(/<\/?b>/g,''),
   kind=pick(big?[['mul','add','sub','cmp'],['divQ','divP','shop'],['change','two','mulsub','mulmul']][L-1]:[['mul','divQ','divP'],['add','sub','cmp'],['shop','change','two','mulsub']][L-1]),
   a=ri(3,9),b=big?ri(12,60):ri(3,9),d=big?ri(3,8):ri(3,9),q=big?ri(12,120):ri(3,9),
   x=big?ri(2000,9000):ri(250,800),y=big?ri(300,Math.min(4000,x-500)):ri(60,190),
   k=ri(2,big?8:6),pr=big?ri(11,35):ri(3,9);
  const W=(t,a,steps,u)=>({t,a,steps,u,w:1});
  switch(kind){
   case'mul':return W(`Es gibt ${a} ${cp}. In ${je} ${cs} sind ${b} ${it}. Wie viele ${it} sind das zusammen?`,a*b,[`Gesucht: alle ${it} zusammen.`,`${a}-mal gleich viel. Das ist eine Mal-Aufgabe: ${a} · ${b}`,...mulS(a,b)]);
   case'divQ':return W(`Es sind insgesamt ${f(d*q)} ${it}. In ${je} ${cs} sind genau ${d} ${it}. Wie viele ${cp} sind es?`,q,[`Gesucht: die Anzahl der ${cp}.`,`Immer ${d} gehören zusammen. Das ist eine Geteilt-Aufgabe: ${f(d*q)} : ${d}`,...(big?divSteps(d*q,d):[`${d*q} : ${d} = <b>${q}</b>`])]);
   case'divP':return W(`${f(d*q)} ${it} werden gleichmäßig auf ${d} ${cp} verteilt. Wie viele ${it} sind in ${je==='jeder'?'einer':'einem'} ${cs}?`,q,[`Gesucht: die ${it} in ${je==='jeder'?'einer':'einem'} ${cs}.`,`Gerecht verteilen heißt teilen: ${f(d*q)} : ${d}`,...(big?divSteps(d*q,d):[`${d*q} : ${d} = <b>${q}</b>`])]);
   case'add':return W(`${fill(P[0],{x:f(x),n})} ${fill(P[3],{y:f(y),n})} Wie viele ${P[1]} sind es jetzt?`,x+y,[`Gesucht: alle ${P[1]} zusammen.`,`Es kommt etwas dazu. Das ist eine Plus-Aufgabe: ${f(x)} + ${f(y)}`,...(big?colAdd(x,y):split(x,y,1))]);
   case'sub':return W(`${fill(P[0],{x:f(x),n})} ${fill(P[2],{y:f(y),n})} Wie viele ${P[1]} sind es jetzt?`,x-y,[`Gesucht: die ${P[1]}, die übrig sind.`,`Es kommt etwas weg. Das ist eine Minus-Aufgabe: ${f(x)} − ${f(y)}`,...(big?colSub(x,y):split(x,y,-1))]);
   case'cmp':{const c=pick(COLL);return W(`${n} hat ${f(x)} ${c} gesammelt, ${m} hat ${f(y)}. Wie viele ${c} hat ${n} mehr als ${m}?`,x-y,[`Gesucht: der Unterschied zwischen ${n} und ${m}.`,`Den Unterschied findest du mit Minus: ${f(x)} − ${f(y)}`,...(big?colSub(x,y):split(x,y,-1))],undefined)}
   case'shop':{const c=big?ri(15,60):ri(8,20),th=pick(SHOP);return W(`${n} kauft ${k} ${th} für je ${pr} € und ${pick(EXTRA)} für ${c} €. Wie viele Euro kostet alles zusammen?`,k*pr+c,[`Schritt 1, die ${th}: ${k} · ${pr}`,...mulS(k,pr).map(plain),`Schritt 2, alles zusammen: ${k*pr} + ${c} = <b>${k*pr+c} €</b>`],'€')}
   case'change':{const th=pick(SHOP),note=[20,50,100,200,500].find(v=>v>k*pr);return W(`${n} kauft ${k} ${th} für je ${pr} € und bezahlt mit ${note} €. Wie viele Euro bekommt ${n} zurück?`,note-k*pr,[`Schritt 1, der Preis: ${k} · ${pr}`,...mulS(k,pr).map(plain),`Schritt 2, das Rückgeld: ${note} − ${k*pr} = <b>${note-k*pr} €</b>`],'€')}
   case'two':{const z=big?ri(200,900):ri(20,90),up=ri(0,1),r1=up?x+y:x-y,r2=up?r1-z:r1+z;
     return W(`${fill(P[0],{x:f(x),n})} ${fill(P[up?3:2],{y:f(y),n})} Danach: ${fill(P[up?2:3],{y:f(z),n})} Wie viele ${P[1]} sind es jetzt?`,r2,[`Es passiert zweimal etwas. Rechne nacheinander.`,`Schritt 1: ${f(x)} ${up?'+':'−'} ${f(y)} = ${f(r1)}`,`Schritt 2: ${f(r1)} ${up?'−':'+'} ${f(z)} = <b>${f(r2)}</b>`])}
   case'mulsub':{const z=ri(2,Math.max(3,Math.floor(a*b/3)));return W(`Es gibt ${a} ${cp}. In ${je} ${cs} sind ${b} ${it}. ${z} ${it} werden nicht gebraucht. Wie viele ${it} werden gebraucht?`,a*b-z,[`Schritt 1, alle ${it}: ${a} · ${b}`,...mulS(a,b).map(plain),`Schritt 2, ohne die übrigen: ${f(a*b)} − ${z} = <b>${f(a*b-z)}</b>`])}
   default:{const c=ri(2,6);return W(`Am Montag gibt es ${a} ${cp}, am Dienstag ${c} ${cp}. In ${je} ${cs} sind ${b} ${it}. Wie viele ${it} sind das an beiden Tagen zusammen?`,(a+c)*b,[`Schritt 1, alle ${cp}: ${a} + ${c} = ${a+c}`,`Schritt 2, alle ${it}: ${a+c} · ${b}`,...mulS(a+c,b)])}
  }}

{id:'zehn',g:3,name:'Mal mit Zehnerzahlen',sym:'·10',

const KEY='matheheft.v1';
const DEF=()=>({app:'matheheft',v:1,name:'',grade:3,sound:true,xp:0,streak:0,best:0,lastDay:null,joker:1,
  today:{d:null,ok:0,mission:false},topics:{},blitz:{},stickers:{},badges:{},due:[],hist:{},
  tot:{ok:0,n:0,help:0,fixed:0,sessions:0,maxCombo:0}});
let state=DEF();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)state=merge(s)}catch(e){}}
function merge(s){const d=DEF();return Object.assign(d,s,{today:Object.assign(d.today,s.today),tot:Object.assign(d.tot,s.tot)})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const st=id=>state.topics[id]||(state.topics[id]={lvl:1,stars:0,ok:0,n:0,row:0,miss:0,ms:0});
const tod=()=>{if(state.today.d!==day())state.today={d:day(),ok:0,mission:false};return state.today};
const hist=()=>state.hist[day()]||(state.hist[day()]={ok:0,n:0});
const level=()=>Math.floor((Math.sqrt(1+8*state.xp/100)-1)/2)+1;
const lvlAt=n=>100*n*(n-1)/2;
const title=()=>TITLES[Math.min(level(),TITLES.length)-1];
function shownStreak(){if(!state.lastDay)return 0;const d=dayDiff(state.lastDay,day());return d<=1||(d===2&&state.joker>0)?state.streak:0}
function markActive(){const d=day();if(state.lastDay===d)return;const diff=state.lastDay?dayDiff(state.lastDay,d):0;
  if(diff===1)state.streak++;else if(diff===2&&state.joker>0){state.joker--;state.streak++}else state.streak=1;
  state.lastDay=d;state.best=Math.max(state.best,state.streak);if(state.streak%7===0)state.joker=Math.min(2,state.joker+1);
  const keys=Object.keys(state.hist).sort();while(keys.length>90)delete state.hist[keys.shift()]}

function tone(fq,t0,dur,type){if(!state.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.value=fq;g.gain.setValueAtTime(.12,AC.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t0+dur);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+t0);o.stop(AC.currentTime+t0+dur)}catch(e){}}

function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const col=['#ffc93c','#2446c4','#1e9e62','#e2503f','#8a5cf6','#ff8fb1'],P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:ri(5,10),c:pick(col),r:Math.random()*6}));
  let n=0;(function fr(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++n<130)requestAnimationFrame(fr);else x.clearRect(0,0,c.width,c.height)})()}

function mk(tid){const q=TOP[tid].gen(st(tid).lvl);q.tid=tid;q.a=String(q.a);return q}
function missionPlan(){const ts=T.filter(t=>t.g===state.grade),due=state.due.filter(id=>TOP[id]&&TOP[id].g===state.grade).slice(0,3);
  const rest=shuffle(ts.filter(t=>!due.includes(t.id))).sort((a,b)=>st(a.id).stars-st(b.id).stars).slice(0,5-due.length).map(t=>t.id);
  const ids=[...due,...rest];return shuffle([...ids,...ids])}
function startSession(kind,plan){S={kind,plan,i:0,ok:0,n:0,combo:0,xp:0,lv0:level(),ups:[],q:null,input:'',lock:false,twins:0};tab='sess';next()}

  S.input='';S.lock=false;S.t0=Date.now();vQ()}

function record(tid,ok,dt,twin){const s=st(tid),h=hist();s.n++;state.tot.n++;h.n++;
  if(ok){s.ok++;s.row++;s.miss=0;s.ms+=dt;state.tot.ok++;h.ok++;tod().ok++;if(!twin)state.due=state.due.filter(x=>x!==tid);
    if(s.row>=4){if(s.lvl<3){s.stars=Math.max(s.stars,s.lvl);s.lvl++;s.row=0;S.ups.push(tid)}else if(s.stars<3){s.stars=3;S.ups.push(tid)}}}
  else{s.row=0;s.miss++;if(s.miss>=2&&s.lvl>1){s.lvl--;s.miss=0}if(!state.due.includes(tid))state.due.push(tid)}}
function gain(x){state.xp+=x;if(S)S.xp+=x}
function submit(){if(!S.input||S.lock)return;const q=S.q,dt=Date.now()-S.t0;
  if(S.input===q.a){S.lock=true;record(q.tid,true,dt,S.twin);S.ok++;S.n++;S.combo++;state.tot.maxCombo=Math.max(state.tot.maxCombo,S.combo);
    let x=S.twin?8:10+Math.min(S.combo-1,5),msg=pick(PRAISE);
    if(S.twin){state.tot.fixed++;msg='Geschafft! Aus dem Fehler gelernt.'}
    else if(q.fast&&dt<5000){x+=2;msg='Blitzschnell!'}
    if(S.combo===3)msg='3 in Folge!';if(S.combo===5)msg='5 in Folge. Du bist im Flow!';if(S.combo===10)msg='10 in Folge. Unaufhaltbar!';
    gain(x);save();snd.ok();$('#inp').classList.add('good');const fb=$('#fb');fb.className='fb';fb.textContent=`${msg} +${x} Punkte`;setTimeout(()=>S&&next(),1000)}
  else{record(q.tid,false,dt);S.n++;S.combo=0;save();snd.no();openGuide('wrong')}}
function openGuide(kind){S.lock=true;G={kind,i:0,given:S.input};if(kind==='help'){record(S.q.tid,false,0);S.n++;S.combo=0;state.tot.help++;save()}vGuide()}
function vGuide(){const q=S.q,t=TOP[q.tid],[em]=title(),done=G.i>=q.steps.length,m=$('#modal');
  const fresh=m.hidden;m.hidden=false;m.innerHTML=`<div class="sheet${fresh?' in':''}" role="dialog" aria-modal="true" aria-label="Erklärung">
  <div class="bubble"><div class="ava" aria-hidden="true">${em}</div><p>${G.kind==='help'?'Super, dass du fragst! So lernen Profis.':pick(CALM)}${G.kind==='wrong'?` Du hattest <b>${esc(G.given.replace('R',' R '))}</b>.`:''}</p></div>
  <div class="rule"><b>So geht's</b><br>${t.rule}</div>
  <div class="task">${q.t}</div>${q.fig||''}
  <ol class="steps">${q.steps.slice(0,G.i).map(s=>`<li><span>${s}</span></li>`).join('')}</ol>
  ${done?`<button class="btn wide" data-a="gdone" id="gbtn">${S.twins<2?'Verstanden. Ich probiere eine ähnliche Aufgabe':'Verstanden. Weiter geht es'}</button>`
    :`<button class="btn sun wide" data-a="gnext" id="gbtn">${G.i?'Nächster Schritt':'Zeig mir den ersten Schritt'} (${G.i+1} von ${q.steps.length})</button>`}
  <details><summary>Ein Beispiel ansehen</summary><div class="ex">${t.ex}</div></details></div>`;
  const sh=m.firstElementChild;sh.scrollTop=sh.scrollHeight}
function finish(){const first=!tod().mission&&S.kind==='mission';gain(20);if(first){gain(30);tod().mission=true}
  state.tot.sessions++;markActive();S.egg=drawSticker();S.first=first;S.newB=checkBadges();save();S.done=true;vResult()}
function drawSticker(){const r=Math.random(),tier=r<.08?2:r<.35?1:0,pool=STK[tier],fresh=pool.filter(e=>!state.stickers[e]),e=fresh.length&&Math.random()<.8?pick(fresh):pick(pool),dup=!!state.stickers[e];
  state.stickers[e]=(state.stickers[e]||0)+1;if(dup)state.xp+=15;return{e,tier,dup}}
function checkBadges(){const n=[];BADGES.forEach(b=>{if(!state.badges[b.id]&&b.t(state)){state.badges[b.id]=day();n.push(b)}});return n}
function rewardsH(R){return `<section class="card res" style="width:100%"><h3>Dein Überraschungs-Ei</h3>
   ${R.open?`<div class="stk tier${R.egg.tier}">${R.egg.e}</div><b>${TIER[R.egg.tier]||'Neuer Sticker!'}</b><span class="muted">${R.egg.dup?'Den hast du schon. Dafür gibt es 15 Extra-Punkte.':'Ab damit in deine Sammlung.'}</span>`
    :`<button class="egg" data-a="egg" aria-label="Ei öffnen">🥚</button><span class="muted">Tippe das Ei an!</span>`}</section>
  ${R.newB.length?`<section class="card list"><h3>Neue Abzeichen</h3>${R.newB.map(b=>`<div class="badge"><div class="sym">${b.i}</div><div><b>${b.n}</b><br><span class="muted">${b.d}</span></div></div>`).join('')}</section>`:''}
  ${level()>R.lv0?`<section class="card res" style="width:100%"><h3>Stufe ${level()} erreicht!</h3><div class="stk">${title()[0]}</div><b>Du bist jetzt ${title()[1]}.</b></section>`:''}
  ${Date.now()-openedAt>25*6e4?'<p class="muted">Du lernst schon eine ganze Weile. Eine Pause tut deinem Kopf gut. Morgen geht es weiter!</p>':''}`}
function vResult(){shell();const r=S.n?S.ok/S.n:0,head=r>=.9?'Fantastisch!':r>=.6?'Gut gemacht!':'Du bist drangeblieben!';
  app.innerHTML=`<div class="res"><h1>${head}</h1><div class="big">${S.ok} <span style="font-size:.45em">von ${S.n} richtig</span></div>
  <div class="row" style="justify-content:center"><span class="chip">+${S.xp} Punkte</span><span class="chip">🔥 ${shownStreak()} ${shownStreak()===1?'Tag':'Tage'}</span></div>
  ${S.first?'<p style="margin:0"><b>Tagesmission erledigt.</b> 30 Bonuspunkte!</p>':''}
  ${r<.6?'<p class="muted" style="margin:0">Jede Erklärung, die du gelesen hast, macht dich stärker. Die Aufgaben kommen bald noch einmal dran.</p>':''}
  ${S.ups.length?`<section class="card list"><h3>Aufgestiegen</h3>${[...new Set(S.ups)].map(id=>`<div class="row sp"><b>${TOP[id].name}</b>${starsH(st(id).stars)}</div>`).join('')}</section>`:''}
  ${rewardsH(S)}
  <div class="row" style="justify-content:center"><button class="btn" data-a="again">Noch eine Runde</button><button class="btn sec" data-a="tab" data-t="home">Fertig für jetzt</button></div></div>`;
  if(!S.shown){S.shown=1;snd.win();confetti()}}

/* ---------- speed round ---------- */
function vBlitzMenu(){app.innerHTML=`<h1>Blitzrunde</h1><p class="muted" style="margin:0">${BLITZ_SEC} Sekunden. So viele Aufgaben wie möglich. Du spielst nur gegen deinen eigenen Rekord.</p>
  <div class="list">${Object.entries(BL).map(([k,b])=>{const r=state.blitz[k];return `<button class="card row" style="text-align:left" data-a="blitz" data-k="${k}"><div class="sym">${b.sym}</div><div style="flex:1"><b style="font-family:var(--display);font-size:18px">${b.name}</b><br><span class="muted">${r?`Rekord: ${r.best} Punkte · ${r.runs} Runden`:'Noch nicht gespielt'}</span></div><span class="chip">Start</span></button>`}).join('')}</div>`}
function startBlitz(k){B={k,score:0,n:0,combo:0,max:0,miss:[],input:'',lock:false,end:Date.now()+BLITZ_SEC*1000,lv0:level()};tab='sess';shell();
  app.innerHTML=`<div class="sess"><div class="sbar"><button class="x" data-a="quit" aria-label="Runde beenden">✕</button><div class="bar"><i id="tb" style="width:100%;transition:none;background:var(--sun)"></i></div><span class="time" id="tt">${BLITZ_SEC}</span></div>
  <div class="row sp"><span class="chip">Punkte: <span id="bs">0</span></span><span class="chip" id="bc"></span><span class="muted">Rekord: ${state.blitz[k]?state.blitz[k].best:0}</span></div>
  <div class="card qcard"><div class="qtopic">${BL[k].name}</div><div class="bq" id="bq"></div><div class="ans"><span class="inp" id="inp"></span></div></div>
  <div class="fb neutral" id="fb">Die Antwort wird automatisch geprüft. Einfach tippen!</div>${padH(false)}</div>`;
  bNext();B.iv=setInterval(()=>{const left=B.end-Date.now();if(left<=0)return bEnd();$('#tb').style.width=left/(BLITZ_SEC*10)+'%';$('#tt').textContent=Math.ceil(left/1000)},100)}
function bNext(){let q;do{q=BL[B.k].gen()}while(B.q&&q.t===B.q.t);q.a=String(q.a);B.q=q;B.input='';B.lock=false;$('#bq').textContent=q.t;const i=$('#inp');i.className='inp';drawInp()}
function bCheck(){const q=B.q,ok=B.input===q.a,fb=$('#fb'),h=hist();B.n++;B.lock=true;h.n++;state.tot.n++;
  if(ok){B.combo++;B.max=Math.max(B.max,B.combo);B.score+=1;h.ok++;state.tot.ok++;tod().ok++;snd.tap();$('#inp').classList.add('good');fb.className='fb';fb.textContent=B.combo>=3?`${B.combo} in Folge!`:pick(PRAISE);setTimeout(()=>B&&bNext(),160)}
  else{B.combo=0;B.miss.push(`${q.t} = ${q.a}`);snd.no();$('#inp').classList.add('oops');fb.className='fb neutral';fb.innerHTML=`Merk dir: <b>${q.t} = ${q.a}</b>`;setTimeout(()=>B&&bNext(),1100)}
  $('#bs').textContent=B.score;$('#bc').textContent=B.combo>1?'🔥 '+B.combo:''}
function bEnd(){clearInterval(B.iv);const r=state.blitz[B.k]||(state.blitz[B.k]={best:0,runs:0,last:[]}),rec=B.score>r.best&&B.score>0;B.prev=r.best;
  r.runs++;r.last=[...(r.last||[]),B.score].slice(-10);if(rec)r.best=B.score;B.rec=rec;B.xp=B.score*3+(rec?20:0)+10;state.xp+=B.xp;
  state.tot.maxCombo=Math.max(state.tot.maxCombo,B.max);state.tot.sessions++;markActive();B.egg=drawSticker();B.newB=checkBadges();save();B.done=true;vBlitzRes()}
function vBlitzRes(){shell();const miss=[...new Set(B.miss)];
  app.innerHTML=`<div class="res"><h1>${B.rec?'Neuer Rekord!':B.score>=B.prev*.8&&B.prev?'Ganz nah am Rekord!':'Stark gerechnet!'}</h1><div class="big">${B.score} <span style="font-size:.45em">Punkte</span></div>
  <div class="row" style="justify-content:center"><span class="chip">+${B.xp} Punkte</span><span class="chip">${B.n?`${(BLITZ_SEC/B.n).toFixed(1).replace('.',',')} s pro Aufgabe`:'0 Aufgaben'}</span><span class="chip">Beste Serie: ${B.max}</span></div>
  <p class="muted" style="margin:0">${B.rec?`Alter Rekord: ${B.prev}. Du wirst schneller!`:`Dein Rekord: ${state.blitz[B.k].best}. Beim nächsten Mal knackst du ihn vielleicht.`}</p>
  ${miss.length?`<section class="card list"><h3>Diese merken wir uns</h3>${miss.slice(0,6).map(m=>`<div class="ex">${m}</div>`).join('')}</section>`:''}
  ${rewardsH(B)}
  <div class="row" style="justify-content:center"><button class="btn" data-a="blitz" data-k="${B.k}">Nochmal</button><button class="btn sec" data-a="tab" data-t="home">Fertig für jetzt</button></div></div>`;
  if(!B.shown){B.shown=1;snd.win();if(B.rec)confetti()}}

/* ---------- collection ---------- */
function vAlbum(){const all=STK.flat(),have=all.filter(e=>state.stickers[e]).length;
  app.innerHTML=`<h1>Sammlung</h1><section class="card"><div class="row sp"><h3>Sticker</h3><span class="muted">${have} von ${all.length}</span></div>
  <p class="muted">Nach jeder Runde gibt es ein Überraschungs-Ei.</p>
  <div class="album">${STK.map((tier,ti)=>tier.map(e=>state.stickers[e]?`<div class="tier${ti}">${e}${state.stickers[e]>1?`<small>×${state.stickers[e]}</small>`:''}</div>`:'<div class="no">?</div>').join('')).join('')}</div></section>
  <section class="card list"><div class="row sp"><h3>Abzeichen</h3><span class="muted">${Object.keys(state.badges).length} von ${BADGES.length}</span></div>
  ${BADGES.map(b=>`<div class="badge ${state.badges[b.id]?'':'off'}"><div class="sym">${state.badges[b.id]?b.i:'🔒'}</div><div><b>${b.n}</b><br><span class="muted">${b.d}</span></div></div>`).join('')}</section>`}

/* ---------- parents / settings / JSON save ---------- */
function vParents(){const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(state.hist[dstr(d)]||{ok:0,n:0})}
  const mx=Math.max(1,...days.map(d=>d.n)),rows=T.filter(t=>state.topics[t.id]&&state.topics[t.id].n).map(t=>{const s=state.topics[t.id];return `<tr><td>${t.g}. ${t.name}</td><td>${'★'.repeat(s.stars)||'–'}</td><td>${s.lvl}</td><td>${Math.round(s.ok/s.n*100)} %</td><td>${s.ok?(s.ms/s.ok/1000).toFixed(1).replace('.',','):'–'} s</td></tr>`}).join('');
  app.innerHTML=`<h1>Einstellungen und Elternbereich</h1>
  <section class="card list"><label for="nm">Name des Kindes<input type="text" id="nm" maxlength="20" value="${esc(state.name)}" placeholder="z. B. Mia"></label>
   <div class="row sp"><b>Klasse</b>${gradeSeg()}</div>
   <div class="row sp"><b>Töne</b><div class="seg"><button data-a="sound" data-v="1" class="${state.sound?'on':''}">An</button><button data-a="sound" data-v="0" class="${state.sound?'':'on'}">Aus</button></div></div></section>
  <section class="card list"><h3>Fortschritt</h3><div class="row"><span class="chip">${state.tot.ok} richtig</span><span class="chip">${state.tot.n?Math.round(state.tot.ok/state.tot.n*100):0} % Trefferquote</span><span class="chip">Längste Serie: ${state.best} Tage</span><span class="chip">${state.tot.help} Erklärungen erbeten</span></div>
   <div><span class="muted">Aufgaben pro Tag, letzte 14 Tage</span><div class="days">${days.map(d=>`<i style="height:${d.n/mx*100}%" title="${d.ok} von ${d.n} richtig"></i>`).join('')}</div></div>
   ${rows?`<div class="scroll"><table><thead><tr><th>Thema</th><th>Sterne</th><th>Stufe</th><th>Richtig</th><th>Ø Zeit</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<span class="muted">Noch keine Aufgaben gelöst.</span>'}
   ${state.due.length?`<span class="muted">Wird bald wiederholt: ${state.due.filter(i=>TOP[i]).map(i=>TOP[i].name).join(', ')}</span>`:''}</section>
  <section class="card list"><h3>Spielstand sichern</h3><p class="muted" style="margin:0">Alles bleibt in diesem Browser auf diesem Gerät. Es wird nichts ins Internet gesendet. Mit der JSON-Datei nimmst du den Spielstand auf ein anderes Gerät mit oder legst eine Sicherung an.</p>
   <div class="row"><button class="btn sm" data-a="exp">Als Datei speichern</button><button class="btn sm sec" data-a="exptxt">Als Text anzeigen</button></div>
   ${ui.txt?`<textarea id="out" readonly aria-label="Spielstand als JSON">${esc(JSON.stringify(state))}</textarea><button class="btn sm sec" data-a="copy">Text kopieren</button>`:''}
   <label for="file">Spielstand aus Datei laden<input type="file" id="file" accept=".json,application/json"></label>
   <label for="paste">Oder JSON-Text hier einfügen<textarea id="paste" placeholder='{"app":"matheheft", ...}'></textarea></label>
   <button class="btn sm sec" data-a="imptxt">Eingefügten Text laden</button></section>
  <section class="card list"><h3>Neu anfangen</h3>${ui.reset?`<b>Wirklich den ganzen Spielstand löschen?</b><div class="row"><button class="btn sm" style="background:var(--bad);color:var(--card);box-shadow:none" data-a="reset2">Ja, alles löschen</button><button class="btn sm sec" data-a="reset0">Abbrechen</button></div>`:`<button class="btn sm sec" data-a="reset1">Spielstand löschen</button>`}</section>`}
function importJSON(txt){try{const s=JSON.parse(txt);if(!s||s.app!=='matheheft'||s.v!==1||typeof s.xp!=='number'||typeof s.topics!=='object')throw 0;state=merge(s);save();ui={};render();toast('Spielstand geladen.')}
  catch(e){toast('Das ist keine gültige Matheheft-Datei.')}}

/* ---------- input ---------- */
function key(k){const X=B&&!B.done?B:S&&!S.done?S:null;if(!X||X.lock||!$('#modal').hidden)return;
  if(k==='back')X.input=X.input.slice(0,-1);
  else if(k==='ok'){if(X===S)submit();return}
  else if(k==='R'){if(X===S&&S.q.rem&&X.input&&!X.input.includes('R'))X.input+='R'}
  else if(X.input.length<9)X.input+=k;
  drawInp();if(X===B&&B.input.length>=B.q.a.length)bCheck()}
const ACT={
 tab:d=>go(d.t),grade:d=>{state.grade=+d.g;save();render()},
 mission:()=>startSession('mission',missionPlan()),
 practice:d=>startSession('topic',Array(8).fill(d.id)),
 theory:d=>{tab='theory';ui={id:d.id};render();scrollTo(0,0)},
 again:()=>S.kind==='mission'?ACT.mission():startSession('topic',S.plan),
 quit:()=>go('home'),k:d=>key(d.k),help:()=>{if(!S.lock)openGuide('help')},
 gnext:()=>{G.i++;snd.tap();vGuide()},
 gdone:()=>{$('#modal').hidden=true;gain(3);if(S.twins<2){S.twins++;S.wantTwin=true}else toast('Das üben wir bald noch einmal.');save();next()},
 egg:()=>{const R=B||S;R.open=true;snd.win();if(R.egg.tier)confetti();B?vBlitzRes():vResult()},
 blitz:d=>{S=null;startBlitz(d.k)},
 sound:d=>{state.sound=d.v==='1';save();render();snd.ok()},
 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'}));a.download=`matheheft-${(state.name||'spielstand').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-')}-${day()}.json`;document.body.append(a);a.click();a.remove();toast('Datei wird gespeichert. Klappt es nicht, nutze „Als Text anzeigen“.')},
 exptxt:()=>{ui.txt=!ui.txt;render()},
 copy:()=>{const o=$('#out');navigator.clipboard.writeText(o.value).then(()=>toast('Kopiert.')).catch(()=>{o.select();toast('Text ist markiert. Jetzt kopieren.')})},
 imptxt:()=>importJSON($('#paste').value),
 reset1:()=>{ui.reset=1;render()},reset0:()=>{ui.reset=0;render()},
 reset2:()=>{state=DEF();save();go('home');toast('Spielstand gelöscht.')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='nm'){state.name=e.target.value.trim();save();shell()}
  if(e.target.id==='file'&&e.target.files[0]){const r=new FileReader();r.onload=()=>importJSON(r.result);r.readAsText(e.target.files[0])}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;
  if(!$('#modal').hidden){if(e.key==='Enter'){e.preventDefault();const b=$('#gbtn');b&&b.click()}return}
  if(/^\d$/.test(e.key))key(e.key);else if(e.key==='Backspace'){e.preventDefault();key('back')}else if(e.key==='Enter'&&(S||B)&&!e.target.closest('button'))key('ok');else if(e.key==='r'||e.key==='R')key('R')});
load();render();
</script>
</body>
</html>
